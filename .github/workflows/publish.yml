name: npm publish
on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC 必須
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # trusted publishing 需要 >= 22.14
          # 不要設 registry-url：它會寫入 _authToken=${NODE_AUTH_TOKEN}，空值會干擾 OIDC
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm publish --access public   # 不用 NODE_AUTH_TOKEN
